name: refresh
on:
  schedule: [{cron: "41 7 * * *"}]  # daily
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: refresh, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Test
        run: python -m unittest discover -s tests -v && node --test tests/*.test.mjs
      - name: Fetch and validate (fails closed)
        id: fetch
        # On a code push a feed outage must not block the deploy: the last good data is built instead.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: python fetch.py
      - name: Build
        run: python build.py
      - name: Commit data only if the feed changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source.json data/changes.json data/history
          if git diff --cached --quiet; then echo "no data change"; else
            git add data/status.json; git commit -m "data: $(date -u +%FT%TZ)"; git push; fi
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
